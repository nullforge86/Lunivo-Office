name: Architektursperre

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  waechter:
    name: Richtungsregeln (Oberfläche → Farmwork → Programmkern)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - name: Wächtertests (nur Importprüfung, ohne Qt-Anzeige)
        run: |
          python -m pip install pytest PySide6-Essentials
          PYTHONPATH=src QT_QPA_PLATFORM=offscreen python -m pytest -q -p no:cacheprovider \
            tests/architektur/test_farmwork_grenze.py \
            tests/architektur/test_farmwork_typen.py \
            tests/architektur/test_core_ohne_qt.py \
            tests/architektur/test_darstellung_baukasten.py
