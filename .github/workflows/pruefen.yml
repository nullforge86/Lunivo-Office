# Was bei jedem Push geprüft wird: die Tests der nativen Qt-Fassung (ohne Bildschirm, offscreen).
# Ubuntu führt alle Tests aus. Windows und macOS prüfen vorerst die plattformnahen Bereiche (Pfade, Sperre, Speichern,
# Dateiformate, Schreibhilfe) und blockieren das Ergebnis noch nicht (continue-on-error), bis ihre Läufe stabil sind.
name: Prüfen

on: [push, pull_request]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Systempakete für Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libgl1
      - name: Abhängigkeiten
        run: pip install -r requirements-dev.txt
      - name: Fehlerprüfung (ruff, nur echte Fehler)
        run: pip install ruff && ruff check .
      - name: Tests
        run: python -m pytest -q tests

  plattformen:
    name: Prüfen (${{ matrix.os }}, Auswahl)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten
        run: pip install -r requirements-dev.txt
      - name: Tests (Auswahl)
        shell: bash
        run: >
          python -m pytest -q
          tests/test_plattform_pfade.py tests/test_plattform_sperre.py tests/test_plattform_protokoll.py
          tests/test_speichern_sicher.py tests/test_storage.py tests/test_formats.py
          tests/test_docx_roundtrip.py tests/test_odt_rtf.py tests/test_schreibhilfe.py tests/test_silben_de.py
