# Was bei jedem Push geprüft wird: die Tests der nativen Qt-Fassung (ohne Bildschirm, offscreen).
# Ubuntu führt alle Tests aus. Windows und macOS prüfen vorerst die plattformnahen Bereiche (Pfade, Sperre, Speichern,
# Dateiformate, Schreibhilfe, Importgrenzen, Speicherkonflikte, DOCX-Korpus) und blockieren das Ergebnis noch nicht (continue-on-error), bis ihre
# Läufe stabil sind. Windows und macOS gelten erst als offiziell unterstützt, wenn diese Läufe grün sind und continue-on-error entfällt (docs/plattformen.md).
name: Prüfen

on: [push, pull_request]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Systempakete für Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libgl1
      - uses: astral-sh/setup-uv@v5
      - name: Abhängigkeiten (aus uv.lock)
        run: uv sync --frozen --extra dev
      - name: Fehlerprüfung (ruff, nur echte Fehler)
        run: uv run --frozen ruff check .
      - name: Tests
        run: uv run --frozen python -m pytest -q tests

  plattformen:
    name: Prüfen (${{ matrix.os }}, Auswahl)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten
        run: pip install -r requirements-dev.txt
      - name: Tests (Auswahl)
        shell: bash
        run: >
          python -m pytest -q
          tests/plattform/pfade.py tests/plattform/sperre.py tests/plattform/protokoll.py
          tests/dokument/speichern_sicher.py tests/plattform/storage.py tests/dokument/formats.py
          tests/dokument/docx_roundtrip.py tests/dokument/odt_rtf.py tests/ki/schreibhilfe.py tests/proofing/silben_de.py
          tests/dokument/import_grenzen.py tests/dokument/speicher_konflikt.py tests/dokument/docx_korpus.py tests/proofing/issue.py tests/ki/ki_einwilligung.py
