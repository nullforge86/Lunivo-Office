[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunivo-writer"
version = "0.1.0"
description = "Lunivo Writer — native Textverarbeitung für Linux (Python 3, PySide6/Qt Widgets)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6,<7", "PySide6-Addons>=6.6,<7", "PySide6-Pdf>=6.6", "python-docx>=1.1", "msoffcrypto-tool>=5", "pyphen>=0.14", "pypdf>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# Lokale Offline-Übersetzung (Argos). Optional: Lunivo startet auch ohne. Zieht torch nach — für die .deb als CPU-Version, siehe werkzeug/bauen/deb-bauen.sh.
offline = ["argostranslate>=1.9"]

[project.scripts]
lunivo-writer = "lunivo_writer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lunivo_writer = ["resources/*", "resources/daten/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
# Nur echte Fehler, die ein Lauf sicher zum Absturz bringen oder falsch machen: Syntaxfehler, nicht definierte Namen, falsche Konstrukte.
# Stilregeln (Importe, Semikolon, Zeilenlänge) prüft die CI bewusst nicht; das Projekt schreibt kurze Anweisungen oft in eine Zeile.
select = ["E9", "F63", "F7", "F82"]
