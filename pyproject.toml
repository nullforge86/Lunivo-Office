[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunivo-writer"
version = "0.1.0"
description = "Lunivo Writer — native Textverarbeitung für Linux (Python 3, PySide6/Qt Widgets)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6", "python-docx", "msoffcrypto-tool", "pyphen", "pypdf"]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4", "ruff>=0.5"]

[project.scripts]
lunivo-writer = "lunivo_writer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lunivo_writer = ["resources/*", "resources/daten/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
# Nur echte Fehler, die ein Lauf sicher zum Absturz bringen oder falsch machen: Syntaxfehler, nicht definierte Namen, falsche Konstrukte.
# Stilregeln (Importe, Semikolon, Zeilenlänge) prüft die CI bewusst nicht; das Projekt schreibt kurze Anweisungen oft in eine Zeile.
select = ["E9", "F63", "F7", "F82"]
